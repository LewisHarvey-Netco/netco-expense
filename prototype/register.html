<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netcompany Expenses — Register</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-title">Create Account</div>
      <div class="auth-subtitle">Join Netcompany Expenses</div>
      <form action="dashboard.html">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="you@netcompany.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" placeholder="Create a password">
        </div>
        <div class="form-group">
          <label class="form-label">I am a...</label>
          <div class="role-selector" id="roleSelector">
            <div class="role-card selected" data-role="consultant">
              <div class="role-icon">💼</div>
              <div class="role-name">Consultant</div>
            </div>
            <div class="role-card" data-role="finance">
              <div class="role-icon">📊</div>
              <div class="role-name">Finance</div>
            </div>
          </div>
        </div>
        <button type="button" class="btn btn-primary" style="width: 100%;" onclick="handleRegister()">Create Account</button>
      </form>
      <div class="auth-link">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>
  <script>
    let selectedRole = 'consultant';
    document.querySelectorAll('.role-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedRole = card.dataset.role;
      });
    });
    function handleRegister() {
      if (selectedRole === 'finance') {
        window.location.href = 'finance/flagged.html';
      } else {
        window.location.href = 'consultant/dashboard.html';
      }
    }
  </script>
  <div class="proto-footer">
    <span>PROTOTYPE NAV:</span>
    <a href="index.html">Info</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="consultant/dashboard.html">Consultant</a>
    <a href="finance/flagged.html">Finance</a>
  </div>
</body>
</html>
